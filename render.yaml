# Render Blueprint — deploys the API (web service) and the React app (static site).
# Render dashboard → New → Blueprint → select this repo. Secrets marked `sync: false`
# are prompted for on first deploy.
services:
  - type: web
    name: reliefchain-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: PAYOUT_SCORE_THRESHOLD
        value: 70

  - type: web
    name: reliefchain-web
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      # Public URL of the API service, e.g. https://reliefchain-api.onrender.com
      # (fromService.host would give the private-network host, which browsers can't reach)
      - key: VITE_API_URL
        sync: false
      - key: VITE_DEMO_RECIPIENT_EMAIL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
